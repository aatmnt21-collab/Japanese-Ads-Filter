name: Build & Sanitize Filter

on:
  push:
    branches:
      - main
  schedule:
    # 毎週日曜日 0:00 (UTC) に自動ビルド・定期メンテナンス
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Build Script
        run: python build.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add filter.txt adblock.txt hosts.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: build, sanitize & remove dead domains" && git push)
