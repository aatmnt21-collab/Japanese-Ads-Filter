name: Run Safety Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Safety & Logic Unit Tests
        run: |
          python -c "
          import build
          
          # 1. ホワイトリスト保護テスト
          assert build.is_whitelisted('vos.line-scdn.net') == True, 'CRITICAL: LINE Voice/Image domain failed'
          assert build.is_whitelisted('play.googleapis.com') == True, 'CRITICAL: Google Play domain failed'
          assert build.is_whitelisted('paypay.ne.jp') == True, 'CRITICAL: PayPay domain failed'
          assert build.is_whitelisted('im.c.yimg.jp') == True, 'CRITICAL: Yahoo News Image domain failed'
          
          # 2. 範囲外ドメイン排除テスト
          assert build.is_ly_ecosystem('doubleclick.net') == False, 'SCOPE GUARD failed'
          
          # 3. 入力自動修復・クレンジングテスト
          assert build.clean_domain('||ads-obs.line-scdn.net^') == 'ads-obs.line-scdn.net', 'AdBlock format cleaning failed'
          assert build.clean_domain('https://ads.yahoo.co.jp/page/1') == 'ads.yahoo.co.jp', 'URL format cleaning failed'
          
          print('ALL SAFETY & LOGIC TESTS PASSED SUCCESSFULLY!')
          "
