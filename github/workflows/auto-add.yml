name: Auto Add Domain from Issue

on:
  issues:
    types: [opened, labeled]

jobs:
  add-domain:
    # 実行条件:
    # 1. 投稿者が「所有者/共同開発者」かつタイトルが「[Add]:」で始まる
    # 2. または、投稿者に関わらず 'auto-add' ラベルが付与された場合
    if: >-
      ((github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'COLLABORATOR') &&
       startsWith(github.event.issue.title, '[Add]:')) ||
      contains(github.event.issue.labels.*.name, 'auto-add')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Domain & Append to extra_denylist.txt
        id: process
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # [Add]: プレフィックスを安全に削除（文字クラスの誤認識防止）
          DOMAIN=$(echo "$ISSUE_TITLE" | sed -E 's/^\[Add\]:\s*//I' | xargs)
          
          if [ -z "$DOMAIN" ]; then
            echo "::error::Domain is empty"
            exit 1
          fi

          # マスター原稿ファイル（extra_denylist.txt）へ追記して一元管理
          echo "$DOMAIN" >> extra_denylist.txt
          echo "domain=$DOMAIN" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Build Script
        run: python build.py

      - name: Commit, Push and Respond via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ADDED_DOMAIN: ${{ steps.process.outputs.domain }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 全出力ファイルおよびマスター原稿のステージング
          git add extra_denylist.txt filter.txt adblock.txt hosts.txt
          
          # filter.txt に実際の差分が発生したか厳密判定
          if git diff --staged --quiet filter.txt; then
            # 弾かれた場合は extra_denylist.txt への追記を取り消してマスター原稿をクリーンに保つ
            git checkout extra_denylist.txt
            gh issue comment $ISSUE_NUMBER --body "⚠️ ドメイン \`$ADDED_DOMAIN\` は安全保護規約（ホワイトリスト/対象外サービス/無効ドメイン/重複）に該当したため、追加されませんでした。"
            gh issue close $ISSUE_NUMBER
          else
            git commit -m "feat: auto-add domain '$ADDED_DOMAIN' from Issue #$ISSUE_NUMBER"
            git push
            gh issue comment $ISSUE_NUMBER --body "🚀 ドメイン \`$ADDED_DOMAIN\` の安全検証・追記・自動ビルドが完了しました！"
            gh issue close $ISSUE_NUMBER
          fi
